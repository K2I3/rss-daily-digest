name: Daily RSS Digest

on:
  schedule:
    # JST 8:00 = UTC 23:00 (前日)
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # Actionsタブから手動実行も可能にする

permissions:
  contents: write  # DBファイルをコミットし直すために必要

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RSS digest
        working-directory: .
        env:
          DB_PATH: data/rss_digest.db
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python src/main.py

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rss_digest.db
          git diff --cached --quiet || git commit -m "chore: update rss database [skip ci]"
          git push
